<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Săn Deal Siêu Hot</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="TryOn.css">
</head>
<body>

    <main class="deal-section">

        <!-- ========== BANNER BÊN TRÁI ========== -->
        <div class="deal-banner">
            <a href="#">
                <!-- 👉 THÊM ẢNH: banner bên trái (đổi link src bên dưới) -->

        </div>

    
        <div class="deal-grid">

            <!-- Sản phẩm 1  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
             
                    <img src="https://thoitrangbigsize.vn/wp-content/uploads/2025/05/Xanh-dam-5.jpg" alt="Sản phẩm 1">
                </div>
                <div class="deal-brand">
                 
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7YXtUockiAJr5vmGOjx8WYLPkMTEjOGRd7QN91LQOIQ&s=10" alt="Thương hiệu 1">
                </div>
                <p class="deal-text">Ưu đãi đến 50%</p>
            </a>

            <!-- Sản phẩm 2  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://bizweb.dktcdn.net/100/502/737/products/o1cn01llnkuh1zsbloahlez2217605-5ecdae97-4372-4038-ae8e-3604acc30c94.jpg?v=1750665629290" alt="Sản phẩm 2">
                </div>
                <div class="deal-brand">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6hJcgSO__LLVIRQcgvnyJa6W72NVULRE3-aR7Pom6KA&s=10" alt="Thương hiệu 2">
                </div>
                <p class="deal-text">Mua 1 tặng 1</p>
            </a>

            <!-- Sản phẩm 3  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://thegioida.vn/wp-content/uploads/2025/03/den-16.jpg" alt="Sản phẩm 3">
                </div>
                <div class="deal-brand">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9C_1V6buL9Fog36k_jltk7JG3ReF-V4bZLdoa-SgR2w&s=10" alt="Thương hiệu 3">
                </div>
                <p class="deal-text">Mua 1 được 2</p>
            </a>

            <!-- Sản phẩm 4  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://cdn.vuahanghieu.com/unsafe/0x900/left/top/smart/filters:quality(90)/https://admin.vuahanghieu.com/upload/product/2023/12/dong-ho-rolex-steel-datejust-36mm-jubilee-bracelet-126234-0051-mau-xanh-bac-658e82a71b695-29122023152615.jpg" alt="Sản phẩm 4">
                </div>
                <div class="deal-brand">
                    <img src="https://suno.vn/blog/wp-content/uploads/2015/12/8_3.jpg" alt="Thương hiệu 4">
                </div>
                <p class="deal-text">Mua 1 tặng 1</p>
            </a>

            <!-- Sản phẩm 5  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://lareboss.com.vn/upload/san-pham/pc23-02a/untitled-design-1920x.png" alt="Sản phẩm 5">
                </div>
                <div class="deal-brand">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSoRPT0a93h5tkHRw_zySx0QCsCAEgoG-j6azDK-h7TIUdDmhy-8ifh_-2G&s=10" alt="Thương hiệu 5">
                </div>
                <p class="deal-text">Mua 1 tặng 1</p>
            </a>

            <!-- Sản phẩm 6  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://bizweb.dktcdn.net/100/441/456/products/2-1743065112741.jpg?v=1743065116023" alt="Sản phẩm 6">
                </div>
                <div class="deal-brand">
                    <img src="https://icolor.vn/wp-content/uploads/2021/03/logo-thuong-hieu-thoi-trang-7-min.jpg" alt="Thương hiệu 6">
                </div>
                <p class="deal-text">Mua 1 tặng 1</p>
            </a>

            <!-- Sản phẩm 7  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6sWQDnb-13XoHeJOIXoQUK4MdZtBgKI5Zog2l3yhjyA&s=10" alt="Sản phẩm 7">
                </div>
                <div class="deal-brand">
                    <img src="https://file.hstatic.net/200000503583/file/logo-cac-thuong-hieu-thoi-trang-noi-tieng-15_e8ad2022abc647a5a2c6bcd7bf678b1d.jpg" alt="Thương hiệu 7">
                </div>
                <p class="deal-text">MUA LÀ CÓ QUÀ</p>
            </a>

            <!-- Sản phẩm 8  (👉 THÊM ẢNH: 1ª img = ảnh sản phẩm, 2ª img = logo thương hiệu) -->
            <a href="#" class="deal-item">
                <div class="deal-product">
                    <img src="https://cavat.com/wp-content/uploads/2017/01/cavat-den-8cm.jpg" alt="Sản phẩm 8">
                </div>
                <div class="deal-brand">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxY2afUzSCLM8tT64TIEl0qeIPMcpwtkjeobw8QC2b4Q&s=10" alt="Thương hiệu 8">
                </div>
                <p class="deal-text">Mua 1 được 6</p>
            </a>

        </div>

        <!-- Nút mũi tên bên phải -->
        <button class="deal-next" type="button" aria-label="Xem tiếp">
            <span></span>
        </button>

    </main>

    <!-- ==================================================
         PHÒNG THỬ ĐỒ
         Logic + dữ liệu sản phẩm nằm trong TryOn.js
         ================================================== -->
    <section class="tryon-section" id="tryon">
        <h2 class="tryon-title">Phòng thử đồ</h2>
        <p class="tryon-sub">Chọn giới tính, màu da rồi bấm "Thử đồ" để xem trang phục lên người mẫu.</p>

        <div class="tryon-layout">

            <!-- ===== CỘT TRÁI: HÌNH NHÂN + ĐIỀU KHIỂN ===== -->
            <div class="tryon-left">

                <!-- Khung hình nhân: tỉ lệ 1:2 (viewBox 300 x 600) -->
                <div class="tryon-stage" id="tryon-stage" data-gender="male">

                    <!-- Lớp 1: cơ thể (SVG, màu da đổi bằng biến --skin) -->
                    <svg class="tryon-body" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg" aria-label="Hình nhân">

                        <!-- ===== NAM ===== -->
                        <g class="body-male">
                            <!-- chân + bàn chân -->
                            <path class="skin" d="M100 295 L148 300 L144 560 L108 560 Z"/>
                            <path class="skin" d="M152 300 L200 295 L192 560 L156 560 Z"/>
                            <path class="skin" d="M106 560 L146 560 L150 582 L96 582 Q96 568 106 560 Z"/>
                            <path class="skin" d="M154 560 L194 560 Q204 568 204 582 L150 582 Z"/>
                            <!-- tay -->
                            <path class="skin" d="M92 118 L70 125 L55 290 L75 295 L98 150 Z"/>
                            <path class="skin" d="M208 118 L230 125 L245 290 L225 295 L202 150 Z"/>
                            <!-- thân -->
                            <path class="skin" d="M92 118 Q150 105 208 118 L200 300 Q150 310 100 300 Z"/>
                            <!-- cổ + đầu -->
                            <rect class="skin" x="139" y="88" width="22" height="30" rx="6"/>
                            <ellipse class="skin" cx="150" cy="60" rx="28" ry="34"/>
                            <!-- tóc ngắn -->
                            <path d="M122 58 Q120 24 150 24 Q180 24 178 58 Q170 40 150 40 Q130 40 122 58 Z" fill="#2e2118"/>
                        </g>

                        <!-- ===== NỮ ===== -->
                        <g class="body-female">
                            <!-- tóc dài (phía sau) -->
                            <path d="M118 52 Q118 20 150 20 Q182 20 182 52 L186 150 Q150 160 114 150 Z" fill="#2e2118"/>
                            <!-- chân + bàn chân -->
                            <path class="skin" d="M98 295 L148 300 L144 560 L110 560 Z"/>
                            <path class="skin" d="M152 300 L202 295 L190 560 L156 560 Z"/>
                            <path class="skin" d="M108 560 L146 560 L150 582 L98 582 Q98 568 108 560 Z"/>
                            <path class="skin" d="M154 560 L192 560 Q202 568 202 582 L150 582 Z"/>
                            <!-- tay -->
                            <path class="skin" d="M100 120 L82 127 L68 285 L86 290 L104 152 Z"/>
                            <path class="skin" d="M200 120 L218 127 L232 285 L214 290 L196 152 Z"/>
                            <!-- thân: vai hẹp, eo thon, hông rộng -->
                            <path class="skin" d="M100 118 Q150 108 200 118 L192 190 Q184 235 206 300 Q150 312 94 300 Q116 235 108 190 Z"/>
                            <!-- cổ + đầu -->
                            <rect class="skin" x="141" y="88" width="18" height="30" rx="6"/>
                            <ellipse class="skin" cx="150" cy="60" rx="26" ry="33"/>
                            <!-- mái tóc -->
                            <path d="M124 56 Q122 26 150 26 Q178 26 176 56 Q166 38 150 38 Q134 38 124 56 Z" fill="#2e2118"/>
                        </g>
                    </svg>

                    <!-- Các lớp quần áo (ảnh PNG trong suốt, src do TryOn.js gán) -->
                    <img class="tryon-layer" id="layer-shoes"   alt="">
                    <img class="tryon-layer" id="layer-bottom"  alt="">
                    <img class="tryon-layer" id="layer-top"     alt="">
                    <img class="tryon-layer" id="layer-outer"   alt="">
                    <img class="tryon-layer" id="layer-watch"   alt="">
                    <img class="tryon-layer" id="layer-glasses" alt="">
                    <img class="tryon-layer" id="layer-hat"     alt="">

                    <div class="tryon-toast" id="tryon-toast"></div>
                </div>

                <!-- Điều khiển giới tính + màu da -->
                <div class="tryon-controls">
                    <div>
                        <p class="ctl-label">Giới tính</p>
                        <div class="gender-switch">
                            <button type="button" class="gender-btn active" data-gender="male">Nam</button>
                            <button type="button" class="gender-btn" data-gender="female">Nữ</button>
                        </div>
                    </div>
                    <div>
                        <p class="ctl-label">Màu da</p>
                        <div class="skin-list" id="skin-list"></div>
                    </div>
                </div>
            </div>

            <!-- ===== CỘT PHẢI: SẢN PHẨM + TÓM TẮT ===== -->
            <div class="tryon-right">
                <div class="tryon-tabs" id="tryon-tabs"></div>
                <div class="tryon-products" id="tryon-products"></div>

                <div class="tryon-summary">
                    <h3 class="sum-title">Bộ đồ đang mặc</h3>
                    <ul class="sum-list" id="sum-list"></ul>
                    <div class="sum-total">
                        <span>Tổng cộng</span>
                        <span id="sum-total">0đ</span>
                    </div>
                    <div class="sum-actions">
                        <button type="button" class="sum-btn primary" id="btn-cart">Thêm cả bộ vào giỏ</button>
                        <button type="button" class="sum-btn" id="btn-clear">Xóa hết</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <script src="TryOn.js"></script>
</body>
</html>
