<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán | M&M Shop</title>

    <script src="../js/main.js" defer></script>
    <script src="../js/catalog-store.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
    <script src="../js/emailjs-config.js" defer></script>
    <script src="../js/checkout.js" defer></script>
    <link rel="stylesheet" href="../css/checkout.css">
</head>

<body>

    <div class="checkout-container">

        <h1>THANH TOÁN ĐƠN HÀNG</h1>

        <!-- Thông tin sản phẩm -->
        <div id="order-info">
            <h2>Thông tin đơn hàng</h2>

            <div id="product-list"></div>

            <h3 id="total-price"></h3>
        </div>

        <!-- Form thanh toán -->
        <form id="checkout-form">

            <h2>Thông tin người nhận</h2>

            <label for="customer-name">Họ và tên:</label>
            <input type="text" id="customer-name" name="customer-name" autocomplete="name" required>

            <label for="customer-phone">Số điện thoại:</label>
            <input type="tel" id="customer-phone" name="customer-phone" autocomplete="tel" required>

            <label for="customer-email">Email:</label>
            <input type="email" id="customer-email" name="customer-email" autocomplete="email" required>

            <label for="customer-address">Địa chỉ nhận hàng:</label>
            <textarea id="customer-address" name="customer-address" autocomplete="street-address" required></textarea>

            <h2>Phương thức thanh toán</h2>

            <label class="payment-option">
                <input type="radio" name="payment" value="COD" checked>
                Thanh toán khi nhận hàng
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="BANK">
                Chuyển khoản ngân hàng
            </label>

            <!-- Thông tin tài khoản ngân hàng -->
            <div id="bank-info" class="bank-info" style="display: none;">

                <h3>Thông tin tài khoản ngân hàng</h3>

                <label for="bank-select">Chọn ngân hàng:</label>
                <select id="bank-select">
                    <option value="">-- Chọn ngân hàng --</option>
                    <option value="Vietcombank">Vietcombank</option>
                    <option value="BIDV">BIDV</option>
                    <option value="VietinBank">VietinBank</option>
                    <option value="MB Bank">MB Bank</option>
                </select>

                <label for="bank-account">Số tài khoản:</label>
                <input type="text" id="bank-account" placeholder="Nhập số tài khoản">

                <button type="button" id="check-account">
                    Kiểm tra
                </button>

                <!-- Chỉ hiện tên sau khi kiểm tra -->
                <div id="account-result" style="display: none;">
                    <label>Chủ tài khoản:</label>
                    <input type="text" id="bank-owner" readonly>
                </div>

            </div>

            <button type="submit">
                XÁC NHẬN ĐẶT HÀNG
            </button>

        </form>

        <!-- Thông báo sau khi đặt hàng -->
        <div id="success-message" class="success-message">

            <h2>Đặt hàng thành công!</h2>

            <p id="order-code"></p>
            <p id="email-status" role="status" aria-live="polite"></p>
            <button type="button" id="retry-email" hidden>Thử gửi email lại</button>

            <a href="orders.html">
                Xem lịch sử đơn hàng
            </a>

            <br>

            <a href="../index.html">
                Quay về trang chủ
            </a>

        </div>

    </div>

</body>

</html>
