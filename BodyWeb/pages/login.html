            <form data-auth-form="register" hidden>

                <label for="register-name">Họ và tên</label>
                <input id="register-name" type="text" autocomplete="name" required>

                <label for="register-username">Tên đăng nhập</label>
                <input id="register-username" type="text" autocomplete="username" required>

                <label for="register-phone">Số điện thoại</label>
                <input id="register-phone" type="tel" autocomplete="tel" required>

                <label for="register-email">Email</label>
                <input id="register-email" type="email" autocomplete="email" required>

                <label for="register-password">Mật khẩu</label>

                <!-- Thêm nút hiển thị mật khẩu đăng ký -->
                <div class="password-box">
                    <input id="register-password" type="password" minlength="6" autocomplete="new-password" required>

                    <button type="button" class="toggle-password" data-target="register-password" aria-label="Hiển thị mật khẩu">
                        👁
                    </button>
                </div>

                <label for="confirm-password">Xác nhận mật khẩu</label>

                <!-- Thêm nút hiển thị mật khẩu xác nhận -->
                <div class="password-box">
                    <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>

                    <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Hiển thị mật khẩu">
