<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | M&amp;M Shop</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page" data-root-prefix="../">
    <main class="auth-container">
        <a class="brand auth-brand" href="../index.html">
            <span class="brand-name">M&amp;M</span><span class="brand-caption">FASHION STORE</span>
        </a>
        <section class="auth-box">
            <div class="auth-tabs" role="tablist" aria-label="Tài khoản">
                <button class="tab-button is-active" type="button" data-auth-tab="login">Đăng nhập</button>
                <button class="tab-button" type="button" data-auth-tab="register">Đăng ký</button>
            </div>
            <p class="form-message" data-auth-message role="status" aria-live="polite"></p>
            <form data-auth-form="login">
                <h1>Chào mừng trở lại!</h1>
                <p class="section-intro">Đăng nhập để tiếp tục mua sắm.</p>
                <label for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="email" required>
                <label for="login-password">Mật khẩu</label>
                <input id="login-password" type="password" autocomplete="current-password" required>
                <button class="button button-primary button-full" type="submit">Đăng nhập</button>
            </form>
            <form data-auth-form="register" hidden>
                <h1>Tạo tài khoản</h1>
                <p class="section-intro">Tham gia cùng M&amp;M Shop ngay hôm nay.</p>
                <label for="register-name">Họ và tên</label>
                <input id="register-name" type="text" autocomplete="name" required>
                <label for="register-email">Email</label>
                <input id="register-email" type="email" autocomplete="email" required>
                <label for="register-password">Mật khẩu</label>
                <input id="register-password" type="password" minlength="6" autocomplete="new-password" required>
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
                <button class="button button-primary button-full" type="submit">Tạo tài khoản</button>
            </form>
        </section>
        <a class="text-link" href="../index.html">&larr; Quay lại cửa hàng</a>
    </main>
    <script src="../js/main.js" defer></script>
</body>
</html>
