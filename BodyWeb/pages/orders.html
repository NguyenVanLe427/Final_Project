<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng | M&amp;M Shop</title>
    <link rel="stylesheet" href="../css/orders.css">
</head>
<body data-root-prefix="../">
    <header class="site-header">
        <a class="brand" href="../index.html" aria-label="M&M Shop - Trang chủ">
            <span class="brand-name">M&amp;M</span><span class="brand-caption">FASHION STORE</span>
        </a>
        <form class="search-form" data-search-form role="search">
            <label class="sr-only" for="site-search">Tìm sản phẩm</label>
            <input id="site-search" name="q" type="search" placeholder="Bạn đang tìm gì?" data-search-input>
            <button type="submit">Tìm kiếm</button>
        </form>
        <div class="header-links">
            <a href="cart.html">Giỏ hàng <span class="cart-count" data-cart-count>0</span></a>
            <a href="login.html" data-user-login>Tài khoản</a>
            <button class="logout-button" type="button" data-user-logout hidden>Đăng xuất</button>
        </div>
    </header>
    <nav class="site-nav" aria-label="Điều hướng chính">
        <a href="../index.html">Trang chủ</a>
        <a href="products.html">Sản phẩm</a>
        <a href="try-on.html">Thử đồ ảo</a>
        <a href="orders.html" aria-current="page">Quản lý đơn hàng</a>
        <a href="cart.html">Giỏ hàng</a>
    </nav>
    <main class="content-section page-content">
        <div class="section-heading">
            <div>
                <p class="eyebrow">THEO DÕI ĐƠN HÀNG</p>
                <h1>Quản lý đơn hàng</h1>
            </div>
            <a class="text-link" href="products.html">Tiếp tục mua sắm</a>
        </div>
        <p class="form-message" data-orders-message role="status" aria-live="polite"></p>
        <div class="order-tabs" data-order-tabs role="tablist" aria-label="Lọc đơn hàng"></div>
        <section class="orders-list" data-orders-list aria-live="polite"></section>
        <p class="empty-state" data-orders-empty hidden></p>
    </main>
    <footer class="site-footer">
        <a class="brand brand-footer" href="../index.html"><span class="brand-name">M&amp;M</span><span class="brand-caption">FASHION STORE</span></a>
        <p>&copy; 2026 M&amp;M Shop</p>
    </footer>
    <script src="../js/main.js" defer></script>
    <script src="../js/catalog-store.js" defer></script>
    <script src="../js/orders.js" defer></script>
</body>
</html>
