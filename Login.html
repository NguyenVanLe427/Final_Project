<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | M&M Shop</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-container">
        <div class="brand">
            <h1>M&M</h1>
            <p>FASHION STORE</p>
        </div>

        <div class="auth-box">
            <div class="auth-tabs">
                <button type="button" id="loginTab" class="tab active">
                    Đăng nhập
                </button>
                <button type="button" id="registerTab" class="tab">
                    Đăng ký
                </button>
            </div>

            <div id="message" class="message" role="status" aria-live="polite"></div>

            <!-- FORM ĐĂNG NHẬP -->
            <form id="loginForm">
                <h2>Chào mừng trở lại!</h2>
                <p class="description">Đăng nhập để tiếp tục mua sắm.</p>

                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Nhập email của bạn" autocomplete="email" required>

                <label for="loginPassword">Mật khẩu</label>
                <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="current-password" required>

                <button type="submit" class="submit-btn">
                    Đăng nhập
                </button>

                <p class="switch-text">
                    Chưa có tài khoản?
                    <a href="#" id="goRegister">Đăng ký ngay</a>
                </p>
            </form>

            <!-- FORM ĐĂNG KÝ -->
            <form id="registerForm" hidden>
                <h2>Tạo tài khoản</h2>
                <p class="description">Tham gia cùng M&M Shop ngay hôm nay.</p>

                <label for="fullName">Họ và tên</label>
                <input type="text" id="fullName" placeholder="Nhập họ và tên" autocomplete="name" required>

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="Nhập email của bạn" autocomplete="email" required>

                <label for="registerPassword">Mật khẩu</label>
                <input type="password" id="registerPassword" placeholder="Ít nhất 6 ký tự" minlength="6" autocomplete="new-password" required>

                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" minlength="6" autocomplete="new-password" required>

                <button type="submit" class="submit-btn">
                    Tạo tài khoản
                </button>

                <p class="switch-text">
                    Đã có tài khoản?
                    <a href="#" id="goLogin">Đăng nhập</a>
                </p>
            </form>

            <p class="back-home">
                <a href="M&M_Shop.html">← Quay lại cửa hàng</a>
            </p>
        </div>

        <p class="footer-text">© 2026 M&M Fashion Store</p>
    </div>

</body>
<script src="style.js" defer></script>

</html>
